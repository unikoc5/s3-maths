<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JM28 · Concept Animations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/jm-lesson.css?v=20260904-jm29b">
  <link rel="stylesheet" href="../../shared/topic-chrome.css?v=20260829s">
  <link rel="stylesheet" href="../../shared/paper-labs.css?v=20260829s">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Hanken Grotesk", system-ui, sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 36px); letter-spacing: -.03em; }
    .lead { margin: 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .deck-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      border-radius: 14px;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .deck-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    .deck-advance {
      position: absolute;
      inset: 0;
      z-index: 2;
      cursor: pointer;
    }
    html.file-preview .deck-advance { pointer-events: none; }
    .hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body class="paper-labs">
  <main class="jm-page">
    <p class="jm-eyebrow">JM28</p>
    <h1>Concept Animations</h1>
    <p class="lead">Manim concept decks only — circumcentre, in-centre, centroid, orthocentre, related checks, and the two bisector lemmas.</p>

    <div class="subnav" id="concept-subnav" aria-label="Concept decks">
      <button class="chip active" type="button" data-deck="circumcentre">Circumcentre</button>
      <button class="chip" type="button" data-deck="in-centre">In-centre</button>
      <button class="chip" type="button" data-deck="centroid">Centroid</button>
      <button class="chip" type="button" data-deck="orthocentre">Orthocentre (challenge)</button>
      <button class="chip" type="button" data-deck="inside-outside">Inside or outside?</button>
      <button class="chip" type="button" data-deck="isosceles-equilateral">Isosceles &amp; equilateral</button>
      <button class="chip" type="button" data-deck="perp-bisector">⊥ bisector</button>
      <button class="chip" type="button" data-deck="angle-bisector">∠ bisector</button>
    </div>

    <div class="deck-wrap">
      <iframe id="deck-frame" src="../../slides/triangle_centres/circumcentre/index.html" title="JM28 concept slides"></iframe>
      <div class="deck-advance" id="deck-advance" role="presentation"></div>
    </div>
    <p class="hint">Click / Space = next. Left = previous.</p>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (location.protocol === "file:") {
        document.documentElement.classList.add("file-preview");
      }
      var base = "../../slides/triangle_centres/";
      var DECKS = {
        "circumcentre": base + "circumcentre/index.html",
        "in-centre": base + "in-centre/index.html",
        "centroid": base + "centroid/index.html",
        "orthocentre": base + "orthocentre/index.html",
        "inside-outside": base + "inside-outside/index.html",
        "isosceles-equilateral": base + "isosceles-equilateral/index.html",
        "perp-bisector": base + "perp-bisector/index.html",
        "angle-bisector": base + "angle-bisector/index.html"
      };
      var frame = document.getElementById("deck-frame");
      var params = new URLSearchParams(location.search);
      var start = params.get("deck");
      if (start && DECKS[start]) {
        frame.src = DECKS[start];
        document.querySelectorAll("#concept-subnav .chip").forEach(function (x) {
          x.classList.toggle("active", x.getAttribute("data-deck") === start);
        });
      }
      document.querySelectorAll("#concept-subnav [data-deck]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("#concept-subnav .chip").forEach(function (x) {
            x.classList.toggle("active", x === btn);
          });
          var id = btn.getAttribute("data-deck");
          if (frame) frame.src = DECKS[id];
          var url = new URL(location.href);
          url.searchParams.set("deck", id);
          history.replaceState(null, "", url);
        });
      });
      function deckStep(dir) {
        var method = dir < 0 ? "prev" : "next";
        try {
          var R = frame && frame.contentWindow && frame.contentWindow.Reveal;
          if (R && R.isReady && R.isReady()) {
            if (dir < 0) R.prev();
            else R.next();
            return;
          }
        } catch (err) {}
        try {
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage(JSON.stringify({ method: method, args: [] }), "*");
          }
        } catch (err2) {}
      }
      var advance = document.getElementById("deck-advance");
      if (advance) {
        advance.addEventListener("click", function () { deckStep(1); });
      }
      function focusDeck() {
        try { if (frame) frame.focus(); } catch (err) {}
      }
      if (frame) {
        frame.addEventListener("load", focusDeck);
        focusDeck();
      }
      document.addEventListener("keydown", function (e) {
        if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;
        var isNext = e.code === "Space" || e.key === " " || e.key === "ArrowRight";
        var isPrev = e.key === "ArrowLeft";
        if (!isNext && !isPrev) return;
        if (location.protocol === "file:") {
          focusDeck();
          return;
        }
        e.preventDefault();
        deckStep(isPrev ? -1 : 1);
      });
    });
  </script>
</body>
</html>
