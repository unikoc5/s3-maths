<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../../shared/topic-chrome.css?v=20260926-direct">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JM31 · Concept &amp; Formula</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/jm-lesson.css?v=20260906-comicw">
  <link rel="stylesheet" href="../../shared/paper-labs.css?v=20260829s">
  <style>
    body { margin:0; min-height:100vh; color:var(--text); font-family:"Hanken Grotesk",system-ui,sans-serif;
      background:linear-gradient(180deg,#f8fafc,#f1f5f9); }
    h1 { margin:0 0 8px; font-size:clamp(26px,4vw,36px); letter-spacing:-.03em; }
    .lead { margin:0 0 18px; color:var(--muted); font-size:15px; line-height:1.55; }
    .deck-wrap {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #0f172a; border-radius: 14px; border: 1px solid var(--line); overflow: hidden;
    }
    .deck-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    .deck-advance { position: absolute; inset: 0; z-index: 2; cursor: pointer; }
    html.file-preview .deck-advance { pointer-events: none; }
  </style>
</head>
<body class="paper-labs">
  <main class="jm-page">
    <p class="jm-eyebrow">JM31</p>
    <h1>Concept &amp; Formula</h1>
    <p class="lead">Mean, median and mode. Click / Space = next. Left = previous.</p>
    <div class="subnav" id="concept-subnav" aria-label="Concept decks">
      <button class="chip active" type="button" data-deck="mean">Mean</button>
      <button class="chip" type="button" data-deck="mean-table">Mean from a table</button>
      <button class="chip" type="button" data-deck="weighted">Weighted mean</button>
      <button class="chip" type="button" data-deck="totals">Think in totals</button>
      <button class="chip" type="button" data-deck="median">Median</button>
      <button class="chip" type="button" data-deck="mode">Mode</button>
      <button class="chip" type="button" data-deck="which-average">Which average?</button>
      <button class="chip" type="button" data-deck="what-changes">What changes?</button>
      <button class="chip" type="button" data-deck="unknowns">Find the unknowns</button>
    </div>
    <div class="deck-wrap">
      <iframe id="deck-frame" src="../../slides/central_tendency/mean/index.html" title="JM31 concept slides"></iframe>
      <div class="deck-advance" id="deck-advance" role="presentation"></div>
    </div>
  </main>
  <script>
    if (location.protocol === "file:") document.documentElement.classList.add("file-preview");
    document.addEventListener("DOMContentLoaded", function () {
      var base = "../../slides/central_tendency/";
      var DECKS = {
        "mean": base + "mean/index.html",
        "mean-table": base + "mean-table/index.html",
        "weighted": base + "weighted/index.html",
        "totals": base + "totals/index.html",
        "median": base + "median/index.html",
        "mode": base + "mode/index.html",
        "which-average": base + "which-average/index.html",
        "what-changes": base + "what-changes/index.html",
        "unknowns": base + "unknowns/index.html"
      };
      var frame = document.getElementById("deck-frame");
      var chips = document.querySelectorAll("#concept-subnav [data-deck]");
      function openDeck(id) {
        if (!DECKS[id]) return;
        chips.forEach(function (x) { x.classList.toggle("active", x.getAttribute("data-deck") === id); });
        if (frame) frame.src = DECKS[id];
      }
      chips.forEach(function (btn) {
        btn.addEventListener("click", function () { openDeck(btn.getAttribute("data-deck")); });
      });
      var start = new URLSearchParams(location.search).get("deck");
      if (start) openDeck(start);
      function deckStep(dir) {
        var method = dir < 0 ? "prev" : "next";
        try {
          var R = frame && frame.contentWindow && frame.contentWindow.Reveal;
          if (R && R.isReady && R.isReady()) {
            if (dir < 0) R.prev(); else R.next();
            return;
          }
        } catch (err) {}
        try {
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage(JSON.stringify({ method: method, args: [] }), "*");
          }
        } catch (err2) {}
      }
      var advance = document.getElementById("deck-advance");
      if (advance) advance.addEventListener("click", function () { deckStep(1); });
      document.addEventListener("keydown", function (e) {
        if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;
        var isNext = e.code === "Space" || e.key === " " || e.key === "ArrowRight";
        var isPrev = e.key === "ArrowLeft";
        if (!isNext && !isPrev) return;
        if (location.protocol === "file:") return;
        e.preventDefault();
        deckStep(isPrev ? -1 : 1);
      });
    });
  </script>
</body>
</html>
